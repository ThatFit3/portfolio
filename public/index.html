<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&display=swap" rel="stylesheet">


    <!-- module of icon package -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  </head>
  <body>
    <section class="h-[60vh] bg-[#1591DC] border-[#C4E2F5] border-[100px] border-b-0 flex flex-col justify-end p-7 text-[#C4E2F5] " id="home">
      <div class="h-[30%] flex items-center">
        <h1 class="montenegrin text-[clamp(5rem,10vw,16rem)] leading-none">
          Hi
        </h1>
      </div>
      <div class="h-[40%]">
        <h2 class="montenegrin text-[clamp(4rem,10vw,12rem)] leading-none">
          Im Fitri
        </h2>
      </div>
      <hr class="h-[2px] bg-[#C4E2F5] w-[100%]">
      <div class="h-[10%] pt-3">
        <h2 class="text-[clamp(2rem,1.5vw,5rem)] leading-none">
          Want to know more about me?
        </h2>
      </div>
    </section>
    
    <nav class="nav-head sticky top-0 mx-auto flex w-[100%] px-[120px] items-center justify-between h-[5vh] bg-[#C4E2F5] text-[#2C5EAD]" id="navbar">

      <div
        class="nav-links left-0 top-2 flex min-h-fit w-full translate-y-[-100%] items-center px-5 py-20 backdrop-blur-sm duration-500 md:static md:w-auto md:translate-y-0 md:bg-transparent md:px-0 md:py-0 md:backdrop-blur-none md:backdrop-filter-none text-ellipsis"
      >
      
        <p class="font-bold"><</p>
        <ul class="flex flex-col gap-[4vw] md:flex-row md:items-center mx-10">
          <li>
            <a
              href="#home"
              class="text-[18px] font-bold duration-[200ms]"
              >Home</a
            >
          </li>
          <li>
            <a
              href="#about"
              class="text-[18px] font-[400] duration-[200ms]"
              >About</a
            >
          </li>
          <li
            <a
              href="#skill"
              class="text-[18px] font-[400] duration-[200ms]"
              >Skills</a
            >
          </li>
          <li>
            <a
              href="#project"
              class="text-[18px] font-[400] duration-[200ms]"
              >Projects</a
            >
          </li>
          <li>
            <a
              href="#contact"
              class="text-[18px] font-[400] duration-[200ms]"
              >Contacts</a
            >
          </li>
        </ul>
        <p class="font-bold">></p>
      </div>

      <div class="flex items-center gap-6 md:hidden">
        <ion-icon
          onclick="onToggleMenu(this)"
          name="menu-outline"
          class="cursor-pointer text-3xl text-white"
        ></ion-icon>
      </div>
    </nav>

    <section class="h-[35vh] text-black bg-[#1591DC] flex justify-end items-end border-[#C4E2F5] border-[100px] border-t-0" id="home">
      
    </section>

    <section
        class="m-0 mt-0 flex w-full flex-col items-center overflow-hidden bg-[#0B1F65] px-12 pb-44 pt-10 md:px-16 lg:px-32 h-[100vh]"
        id="about"
      ></section>
  </body>
</html>
