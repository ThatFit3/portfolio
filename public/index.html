<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>


    <!-- module of icon package -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  </head>
  <body>
    <section class="h-[60vh] text-black bg-[#1591DC] flex justify-end items-end border-[#C4E2F5] border-[100px] border-b-0" id="home">
      
    </section>
    
    <nav class="nav-head sticky top-0 mx-auto flex w-[100%] px-[120px] items-center justify-between h-[5vh] bg-[#C4E2F5]" id="navbar">

      <div
        class="nav-links left-0 top-2 flex min-h-fit w-full translate-y-[-100%] items-center bg-black/60 px-5 py-20 backdrop-blur-sm duration-500 md:static md:w-auto md:translate-y-0 md:bg-transparent md:px-0 md:py-0 md:backdrop-blur-none md:backdrop-filter-none"
      >
      
        <ul class="flex flex-col gap-[4vw] md:flex-row md:items-center">
          <li class="text-white">
            <a
              href="#home"
              class="text-[18px] font-bold text-[#fff] duration-[200ms]"
              >Home</a
            >
          </li>
          <li class="text-white">
            <a
              href="#about"
              class="text-[18px] font-[400] text-[#fff] duration-[200ms]"
              >About</a
            >
          </li>
          <li class="text-white">
            <a
              href="#skill"
              class="text-[18px] font-[400] text-[#fff] duration-[200ms]"
              >Skills</a
            >
          </li>
          <li class="text-white">
            <a
              href="#project"
              class="text-[18px] font-[400] text-[#fff] duration-[200ms]"
              >Projects</a
            >
          </li>
          <li class="text-white">
            <a
              href="#contact"
              class="text-[18px] font-[400] text-[#fff] duration-[200ms]"
              >Contacts</a
            >
          </li>
        </ul>
      </div>

      <div class="flex items-center gap-6 md:hidden">
        <ion-icon
          onclick="onToggleMenu(this)"
          name="menu-outline"
          class="cursor-pointer text-3xl text-white"
        ></ion-icon>
      </div>
    </nav>

    <section class="h-[35vh] text-black bg-[#1591DC] flex justify-end items-end border-[#C4E2F5] border-[100px] border-t-0" id="home">
      
    </section>

    <section
        class="m-0 mt-0 flex w-full flex-col items-center overflow-hidden bg-[#0B1F65] px-12 pb-44 pt-10 md:px-16 lg:px-32 h-[100vh]"
        id="about"
      ></section>
  </body>
</html>
